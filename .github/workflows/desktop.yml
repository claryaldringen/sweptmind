name: Desktop
# Release: bump "version" in apps/desktop/package.json, then
#   git tag desktop-vX.Y.Z && git push origin desktop-vX.Y.Z
# The settings page links to the latest release's SweptMind.dmg.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: corepack enable && yarn install --immutable
      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "desktop-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/desktop version $version"
            exit 1
          fi
      - name: Build the macOS app
        run: yarn build --publish never
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "$GITHUB_REF_NAME" apps/desktop/release/SweptMind.dmg \
            --title "SweptMind pro Mac ${GITHUB_REF_NAME#desktop-v}" \
            --notes "Aplikace pro macOS (Apple Silicon i Intel). Není notarizovaná – při prvním spuštění ji povol v Nastavení systému → Soukromí a zabezpečení → Přesto otevřít." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: sweptmind-macos
          path: apps/desktop/release/SweptMind.dmg
          retention-days: 14
