name: Android
on:
  push:
    paths:
      - "apps/mobile/**"
      - "packages/capacitor-geofence/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: corepack enable && yarn install --immutable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Sync Capacitor plugins into the Android project
        run: npx cap sync android
        working-directory: apps/mobile
      # Firebase config for push notifications — kept out of the public repo. Without it
      # the APK still builds, the app just doesn't offer push (AppInfo.pushConfigured).
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/android/app/google-services.json
            echo "google-services.json written"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — the APK won't offer push notifications"
          fi
      # A fixed signing key — with a fresh one per runner, every new APK had to be
      # uninstalled first
      - name: Use the fixed debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "ANDROID_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE secret not set — the APK is signed with a throwaway key"
          fi
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: apps/mobile/android
      - name: Show the signing certificate
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: sweptmind-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
